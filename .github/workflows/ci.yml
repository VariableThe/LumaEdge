name: LumaEdge CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-and-build:
    name: Build & Test (macOS 14+ Apple Silicon)
    runs-on: macos-15
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Select Xcode Version
      run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

    - name: Run Swift Package Manager Tests
      run: swift test -v --parallel

    - name: Build Release App & CLI
      run: |
        swift build -c release
        mkdir -p build/LumaEdge.app/Contents/MacOS
        mkdir -p build/LumaEdge.app/Contents/Resources
        cp .build/release/LumaEdgeApp build/LumaEdge.app/Contents/MacOS/LumaEdgeApp
        cp .build/release/lumaedge build/LumaEdge.app/Contents/MacOS/lumaedge

    # Upload the archive, not the bundle directory: upload-artifact normalizes file modes.
    - name: Archive and verify the runnable macOS app
      run: |
        set -eu
        /usr/bin/ditto -c -k --sequesterRsrc --keepParent build/LumaEdge.app build/LumaEdge.zip
        check_dir="$(mktemp -d "$RUNNER_TEMP/lumaedge-artifact.XXXXXXXX")"
        /usr/bin/ditto -x -k build/LumaEdge.zip "$check_dir"
        test -x "$check_dir/LumaEdge.app/Contents/MacOS/LumaEdgeApp"
        test -x "$check_dir/LumaEdge.app/Contents/MacOS/lumaedge"
        /usr/bin/plutil -lint "$check_dir/LumaEdge.app/Contents/Info.plist"

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: LumaEdge-macOS
        path: build/LumaEdge.zip
        if-no-files-found: error
